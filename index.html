<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SkyFetch Weather Dashboard</title>

<style>

body{
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#4facfe,#00f2fe);
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:flex-start;
min-height:100vh;
}

.container{
background:white;
margin-top:40px;
padding:25px;
border-radius:10px;
width:500px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

h1{
text-align:center;
margin-bottom:20px;
}

.search-box{
display:flex;
gap:10px;
margin-bottom:20px;
}

.search-box input{
flex:1;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
}

.search-box button{
padding:10px 15px;
border:none;
background:#4facfe;
color:white;
border-radius:6px;
cursor:pointer;
}

.search-box button:hover{
background:#3a8ce0;
}

.recent{
margin-bottom:15px;
}

.recent button{
margin:5px;
padding:6px 10px;
border:none;
background:#eee;
border-radius:5px;
cursor:pointer;
}

.recent button:hover{
background:#ddd;
}

.weather{
text-align:center;
margin-top:10px;
}

.weather img{
width:70px;
}

.forecast{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-top:20px;
}

.card{
background:#f5f5f5;
padding:10px;
border-radius:8px;
text-align:center;
font-size:14px;
}

.clear-btn{
margin-top:10px;
padding:6px 10px;
background:#ff5c5c;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h1>SkyFetch Weather</h1>

<div class="search-box">
<input id="cityInput" placeholder="Enter city name">
<button id="searchBtn">Search</button>
</div>

<div class="recent">
<strong>Recent Searches:</strong>
<div id="recentContainer"></div>
<button class="clear-btn" id="clearBtn">Clear History</button>
</div>

<div class="weather" id="weather"></div>

<div class="forecast" id="forecast"></div>

</div>

<script>

class WeatherApp{

constructor(){

this.apiKey="eefabd6d53f7a6a62153882981023c67";

this.cityInput=document.getElementById("cityInput");
this.searchBtn=document.getElementById("searchBtn");

this.weatherDiv=document.getElementById("weather");
this.forecastDiv=document.getElementById("forecast");

this.recentContainer=document.getElementById("recentContainer");
this.clearBtn=document.getElementById("clearBtn");

this.recentSearches=[];

this.init();
}

init(){

this.searchBtn.addEventListener("click",()=>{
let city=this.cityInput.value.trim();
if(city){
this.getWeather(city);
}
});

this.clearBtn.addEventListener("click",()=>this.clearHistory());

this.loadRecentSearches();
this.loadLastCity();
}

async getWeather(city){

try{

this.weatherDiv.innerHTML="Loading...";

const weatherRes=await fetch(
`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${this.apiKey}`
);

const weatherData=await weatherRes.json();

if(weatherData.cod!==200){
this.weatherDiv.innerHTML="City not found";
return;
}

const forecastRes=await fetch(
`https://api.openweathermap.org/data/2.5/forecast?q=${city}&units=metric&appid=${this.apiKey}`
);

const forecastData=await forecastRes.json();

this.displayWeather(weatherData);
this.displayForecast(forecastData);

this.saveRecentSearch(city);
localStorage.setItem("lastCity",city);

}catch(err){

this.weatherDiv.innerHTML="Error loading weather";

}

}

displayWeather(data){

this.weatherDiv.innerHTML=`
<h2>${data.name}</h2>
<img src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png">
<h3>${Math.round(data.main.temp)}°C</h3>
<p>${data.weather[0].description}</p>
`;

}

displayForecast(data){

this.forecastDiv.innerHTML="";

let list=data.list.filter(item=>item.dt_txt.includes("12:00:00"));

list.slice(0,5).forEach(day=>{

let card=document.createElement("div");

card.className="card";

let date=new Date(day.dt_txt).toDateString().slice(0,10);

card.innerHTML=`
<p>${date}</p>
<img src="https://openweathermap.org/img/wn/${day.weather[0].icon}.png">
<p>${Math.round(day.main.temp)}°C</p>
`;

this.forecastDiv.appendChild(card);

});

}

saveRecentSearch(city){

city=city.charAt(0).toUpperCase()+city.slice(1).toLowerCase();

this.recentSearches=this.recentSearches.filter(c=>c!==city);

this.recentSearches.unshift(city);

if(this.recentSearches.length>5){
this.recentSearches.pop();
}

localStorage.setItem("recentSearches",JSON.stringify(this.recentSearches));

this.displayRecentSearches();

}

loadRecentSearches(){

let saved=localStorage.getItem("recentSearches");

if(saved){
this.recentSearches=JSON.parse(saved);
}

this.displayRecentSearches();

}

displayRecentSearches(){

this.recentContainer.innerHTML="";

this.recentSearches.forEach(city=>{

let btn=document.createElement("button");

btn.textContent=city;

btn.addEventListener("click",()=>{
this.getWeather(city);
});

this.recentContainer.appendChild(btn);

});

}

loadLastCity(){

let last=localStorage.getItem("lastCity");

if(last){
this.getWeather(last);
}

}

clearHistory(){

localStorage.removeItem("recentSearches");
this.recentSearches=[];
this.displayRecentSearches();

}

}

new WeatherApp();

</script>

</body>
</html>
