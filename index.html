<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SkyFetch Weather Dashboard</title>

<style>
body{
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#46325c,#778091);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.container{
background:white;
color:black;
padding:30px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
width:300px;
}

h1{
margin-bottom:20px;
}

#weather img{
width:80px;
}

button{
margin-top:15px;
padding:10px 15px;
border:none;
background:#2575fc;
color:white;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#1b5ed6;
}
</style>
</head>

<body>

<div class="container">

<h1>SkyFetch</h1>

<div id="weather">
<h2 id="city"></h2>
<p id="temp"></p>
<p id="description"></p>
<img id="icon"/>
</div>

<button onclick="getWeather('London')">Refresh</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>

const API_KEY = "eefabd6d53f7a6a62153882981023c67";

function getWeather(city){

const url =
`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`;

axios.get(url)

.then(function(response){

const data = response.data;

document.getElementById("city").textContent = data.name;

document.getElementById("temp").textContent =
"Temperature: " + data.main.temp + "°C";

document.getElementById("description").textContent =
data.weather[0].description;

const icon =
`https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;

document.getElementById("icon").src = icon;

})

.catch(function(error){
console.log("Error fetching weather:", error);
});

}

getWeather("London");

</script>

</body>
</html>
